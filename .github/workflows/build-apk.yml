name: build

on:
  push:
    paths: ["android/**", "server/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  apk:
    runs-on: ubuntu-latest   # le SDK Android est préinstallé sur l'image GitHub
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v7
        with:
          name: santesync-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
