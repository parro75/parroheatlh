# Connecteur Samsung Health (dépôt parro75/parroheatlh). Données de santé RÉELLES :
# surface minimale, aucun accès sortant, rien de publié.
services:
  shc:
    build: .
    image: shc:0.10.1
    container_name: shc
    restart: unless-stopped
    user: "10001:10001"
    env_file: .env          # mode 600 : INGEST_TOKEN, OWNER_PASSWORD_HASH, TOTP_SECRET, PUBLIC_URL

    # AUCUN réseau (25/11/2026) : ni Internet, ni l'hôte, ni pont Docker. Caddy parle au service par un
    # socket Unix dans /var/lib/sante-run (750, propriétaire 10001), monté aussi dans le conteneur Caddy.
    # Plus de trafic en clair sur un pont, plus de règle de pare-feu à maintenir.
    network_mode: none
    environment:
      UNIX_SOCKET: /run/shc/shc.sock

    # Base SQLite HORS de /opt : elle n'entre pas dans la sauvegarde nocturne en clair
    # (décision du 25/11/2026 — en cas de perte, réimport depuis le téléphone).
    volumes:
      - /var/lib/sante:/data
      - /var/lib/sante-run:/run/shc

    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 512m   # l'import d'un export envoyé par le téléphone tourne dans le service (~125 Mo)
    cpus: 0.5
    pids_limit: 64
