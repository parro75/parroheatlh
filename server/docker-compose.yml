services:
  shc:
    build: .
    image: samsung-health-connector:0.1.0
    container_name: samsung-health-connector
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data          # chown 10001 ./data avant le premier démarrage
    ports:
      - "127.0.0.1:8080:8080" # derrière le reverse proxy HTTPS, jamais exposé tel quel
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
