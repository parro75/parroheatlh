# Connecteur Samsung Health (dépôt parro75/parroheatlh). Données de santé RÉELLES :
# surface minimale, aucun accès sortant, rien de publié.
services:
  shc:
    build: .
    image: shc:0.15.2
    container_name: shc
    restart: unless-stopped
    user: "10001:10001"
    env_file: .env          # mode 600 : INGEST_TOKEN, OWNER_PASSWORD_HASH, TOTP_SECRET, PUBLIC_URL

    # AUCUN réseau (25/11/2026) : ni Internet, ni l'hôte, ni pont Docker. Caddy parle au service par un
    # socket Unix dans /var/lib/sante-run (750, propriétaire 10001), monté aussi dans le conteneur Caddy.
    # Plus de trafic en clair sur un pont, plus de règle de pare-feu à maintenir.
    network_mode: none
    environment:
      UNIX_SOCKET: /run/shc/shc.sock
      # Volume chiffré (deploy/volume-chiffre/) : sans ce fichier dans /data, refus de démarrer
      # (sinon, volume verrouillé = base vide créée EN CLAIR dans le dossier de montage).
      # Écritures signées par le téléphone appairé (shc/devices.py) : le jeton seul ne suffit plus.
      # Nouveau téléphone : se connecter dans l'app (mot de passe + TOTP) l'appaire ; ancien : admin revoke-device.
      DEVICE_SIGNATURE: required
      # Connexion : mot de passe + clé d'accès (passkey, clé FIDO2) OU TOTP en secours (any) ; passkey = clé seulement.
      AUTH_SECOND_FACTOR: any
      DATA_MARKER: .volume-chiffre   # retirer cette ligne si la base n'est pas sur un volume chiffré

    # Base SQLite HORS de /opt, dans un volume LUKS2 (deploy/volume-chiffre/) monté sur /var/lib/sante ;
    # clé jamais sur ce serveur. Volume fermé : dossier immuable + DATA_MARKER absent → refus de démarrer.
    volumes:
      - /var/lib/sante:/data
      - /var/lib/sante-run:/run/shc

    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 512m   # l'import d'un export envoyé par le téléphone tourne dans le service (~125 Mo)
    memswap_limit: 512m   # = mem_limit : AUCUN swap (le swap de l'hôte n'est pas chiffré)
    cpus: 0.5
    pids_limit: 64
